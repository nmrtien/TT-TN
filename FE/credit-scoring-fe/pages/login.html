<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng nhập - Credit Scoring</title>
<link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="brand-mark">CS</div>
  <h1>Credit Scoring</h1>
  <p>Hệ thống quản lý hồ sơ chấm điểm tín dụng</p>
  <form id="loginForm">
    <label>Tên đăng nhập</label>
    <input id="username" required placeholder="Nhập tên đăng nhập">
    <label>Mật khẩu</label>
    <input id="password" type="password" required placeholder="Nhập mật khẩu">
    <div class="login-row"><label class="check"><input type="checkbox"> Ghi nhớ đăng nhập</label><a href="#">Quên mật khẩu?</a></div>
    <button class="btn primary full" type="submit">Đăng nhập</button>
  </form>
</div>
<script src="../js/auth.js"></script>
</body>
</html>
